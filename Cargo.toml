[workspace]
resolver = "2"
members = ["crates/tracker-core", "src-tauri"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"

[profile.release]
lto = true
strip = true
